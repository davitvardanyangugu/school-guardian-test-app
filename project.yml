name: SchoolGuardianTest
options:
  bundleIdPrefix: com.schoolguardian
  deploymentTarget:
    iOS: "17.0"
targets:
  SchoolGuardianTest:
    type: application
    platform: iOS
    sources:
      - path: SchoolGuardianTestApp.swift
      - path: TestWebView.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolguardian.testapp
        PRODUCT_NAME: School Guardian Test
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
